# Render Blueprint: APIx-India (FastAPI + PostgreSQL)
# Deploy with 1-click on https://render.com
services:
  # 1. Python FastAPI Backend Service
  - type: web
    name: apix-fastapi-backend
    env: python
    region: singapore # Close to India (low latency for DGCA / Indian airline servers)
    plan: free
    buildCommand: "pip install -r backend/requirements.txt && playwright install chromium --with-deps 2>/dev/null || true"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apix-postgres
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: ENVIRONMENT
        value: production
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /api/v1/health

  # 2. React Vite Frontend Web Application
  - type: web
    name: apix-frontend
    env: static
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        value: "https://apix-fastapi-backend.onrender.com"

databases:
  # 2. Managed PostgreSQL Database for Time-Series Fare Storage
  - name: apix-postgres
    databaseName: apix_india
    user: apix_admin
    region: singapore
    plan: free
    ipAllowList: [] # Allow all Render services within private network
